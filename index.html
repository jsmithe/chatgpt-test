<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17112b">
  <meta name="description" content="A tiny web page featuring a dancing kitten.">
  <title>Dancing Kitten · ChatGPT Test Lab</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; color: #fff4fb; background: radial-gradient(circle at 20% 15%, #57316d 0, transparent 35%), radial-gradient(circle at 85% 80%, #244b70 0, transparent 35%), #17112b; }
    main { width: min(760px, 100%); text-align: center; padding: clamp(2rem, 6vw, 4rem); border: 1px solid #ffffff26; border-radius: 30px; background: #211a36df; box-shadow: 0 24px 80px #0007; }
    .eyebrow { color: #f6a9d5; font-size: .78rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 1rem 0 .5rem; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1; letter-spacing: -.05em; }
    p { color: #d6c8e2; font-size: 1.08rem; line-height: 1.7; }
    .stage { min-height: 260px; display: grid; place-items: center; overflow: hidden; }
    .kitten { font-size: clamp(7rem, 24vw, 12rem); line-height: 1; display: inline-block; transform-origin: 50% 85%; animation: dance .75s ease-in-out infinite alternate; filter: drop-shadow(0 18px 18px #0005); }
    .sparkle { display: inline-block; color: #ffd3ef; font-size: 2rem; animation: twinkle 1s ease-in-out infinite alternate; }
    .sparkle.left { margin-right: 1rem; } .sparkle.right { margin-left: 1rem; animation-delay: .4s; }
    .note { margin-top: 1.5rem; color: #bbaacb; font-size: .9rem; }
    @keyframes dance { from { transform: rotate(-13deg) translateY(5px) scale(1); } to { transform: rotate(13deg) translateY(-13px) scale(1.06); } }
    @keyframes twinkle { from { opacity: .35; transform: scale(.7) rotate(-15deg); } to { opacity: 1; transform: scale(1.2) rotate(15deg); } }
    @media (prefers-reduced-motion: reduce) { .kitten, .sparkle { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">ChatGPT Test Lab presents</div>
    <h1>Dance, little kitten!</h1>
    <p>A tiny bit of joy, powered by HTML and CSS.</p>
    <div class="stage" role="img" aria-label="A cat face dancing from side to side with sparkles">
      <span class="sparkle left" aria-hidden="true">✦</span>
      <span class="kitten" aria-hidden="true">🐱</span>
      <span class="sparkle right" aria-hidden="true">✦</span>
    </div>
    <p class="note">Keep the good vibes going. ✨</p>
  </main>
</body>
</html>
